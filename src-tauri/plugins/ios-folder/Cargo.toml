[package]
name = "tauri-plugin-ios-folder"
version = "0.1.0"
edition = "2021"
description = "Minimal iOS folder picker for SendMe: pick a folder, keep access with a bookmark, copy files in and out."
publish = false
links = "tauri-plugin-ios-folder"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
