[package]
name = "sendme-gui"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sendme_gui"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
percent-encoding = "2"
# netdev (pulled in by iroh) uses libc items that libc 0.2.190+ no longer exports
# on iOS (RTAX_MAX, in6_ifreq), which breaks iOS builds. Revisit when netdev or
# libc fixes this; check with `yarn ios:build` before lifting it.
libc = ">=0.2.150, <0.2.190"
tauri-plugin-shell = "2"
tauri-plugin-barcode-scanner = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.4.10", features = ["derive"] }
derive_more = { version = "2.1.1", features = [
    "display",
    "from_str"
] }
anyhow = "1.0.75"
futures-buffered = "0.2.4"
futures = "0.3"
indicatif = "0.18.6"
iroh-blobs = { version = "0.103.1" }
iroh = "1.0.0"
irpc = "0.17.0"
num_cpus = "1.16.0"
rand = "0.10"
tokio = { version = "1.34.0", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
walkdir = "2.4.0"
data-encoding = "2.6.0"
n0-future = "0.3"
dirs = "7.0"
lazy_static = "1.4"
# "rustls-no-provider" like iroh: the default "rustls" feature drags in aws-lc (C code),
# which is painful to cross-compile for Android and iOS. The ring provider is installed
# in sendme::http_client().
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Bundled root certificates, like iroh. reqwest's default checker uses the platform's
# trust store, which panics on Android without JNI setup the app does not do.
webpki-roots = "1"
dotenv = "0.15.0"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = "29"

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-ios-folder = { path = "plugins/ios-folder" }

[dev-dependencies]
tempfile = "3"

# Debug builds run dependencies unoptimised, which makes hashing (blake3) about ten
# times slower: a 10 GB import took over ten minutes. Optimise only the dependencies;
# our own crate stays fast to rebuild.
[profile.dev.package."*"]
opt-level = 3
